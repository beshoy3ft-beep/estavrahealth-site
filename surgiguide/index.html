<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SurgiGuide · Your surgery, explained</title>
<meta name="description" content="Clear information about your test or operation, from your surgical team. Download SurgiGuide.">
<link rel="apple-touch-icon" href="icon.png">
<link rel="icon" href="icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Manrope:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{color-scheme:light dark;--bg:light-dark(#F4FAF9,#0A1217);--card:light-dark(#FFFFFF,#121C22);--ink:light-dark(#0E1A22,#EEF3F4);--muted:light-dark(#56636B,#A3B1BA);--teal:#0F766E;--line:light-dark(#E2ECEA,#1F2C35)}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:flex;flex-direction:column;background:var(--bg);color:var(--ink);font:17px/1.6 Inter,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
main{flex:1;display:flex;align-items:center;justify-content:center;padding:40px 22px}
.card{width:100%;max-width:420px;text-align:center}
.icon{display:block;width:88px;height:88px;border-radius:22px;margin:0 auto 22px;box-shadow:0 10px 30px rgba(15,118,110,.25)}
h1{font:700 34px/1.1 Manrope,sans-serif;letter-spacing:-.03em;margin:0 0 10px}
.lead{color:var(--muted);margin:0 0 30px}
.btn{display:flex;align-items:center;justify-content:center;gap:12px;width:100%;min-height:60px;margin:0 0 12px;border-radius:14px;text-decoration:none;font-weight:600;font-size:17px;transition:transform .1s}
.btn:active{transform:scale(.98)}
.btn[aria-disabled=true]{pointer-events:none;opacity:.55}
.btn.primary{background:var(--ink);color:var(--bg)}
.btn.secondary{background:var(--card);color:var(--ink);border:1px solid var(--line)}
.btn small{display:block;font-weight:400;font-size:12px;opacity:.75;line-height:1.2}
.btn span{text-align:left;line-height:1.25}
.note{margin:26px 0 0;font-size:14px;color:var(--muted)}
.note strong{color:var(--ink)}
footer{padding:22px;text-align:center;font-size:12.5px;color:var(--muted);line-height:1.7}
footer a{color:var(--muted)}
</style>
</head>
<body>
<main>
  <div class="card">
    <img class="icon" src="icon.png" width="88" height="88" alt="SurgiGuide app icon">
    <h1>SurgiGuide</h1>
    <p class="lead">Clear information about your test or operation, from your surgical team.</p>

    <!-- When live: add href="<store link>", remove aria-disabled, and change "Coming soon for" back to "Download for" -->
    <a class="btn primary" id="ios" aria-disabled="true">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M7 2h10a2 2 0 012 2v16a2 2 0 01-2 2H7a2 2 0 01-2-2V4a2 2 0 012-2zm0 3v13h10V5H7zm5 14.2a1 1 0 100 2 1 1 0 000-2z"/></svg>
      <span><small>Coming soon for</small>iPhone</span>
    </a>
    <a class="btn secondary" id="android" aria-disabled="true">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M7 2h10a2 2 0 012 2v16a2 2 0 01-2 2H7a2 2 0 01-2-2V4a2 2 0 012-2zm0 3v13h10V5H7zm5 14.2a1 1 0 100 2 1 1 0 000-2z"/></svg>
      <span><small>Coming soon for</small>Android</span>
    </a>

    <p class="note">Free · No account needed<br><strong>In an emergency, call 999.</strong></p>
  </div>
</main>
<footer>
  <a href="privacy.html">Privacy policy</a> · <a href="mailto:surgiguide@estavrahealth.com">Contact</a><br>
  SurgiGuide is provided by Estavra Health Ltd
</footer>
<script>
// On a phone, gently highlight the right store button first
try{
  var ua=navigator.userAgent||"";
  if(/android/i.test(ua)){
    var a=document.getElementById('android'),i=document.getElementById('ios');
    a.classList.replace('secondary','primary');i.classList.replace('primary','secondary');
    a.parentNode.insertBefore(a,i);
  }
}catch(e){}
</script>
</body>
</html>
